# Render blueprint: Flask + Selenium/Chromium backend backed by MongoDB Atlas.
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repo.
# (Docker runtime is required so Chromium/ChromeDriver are available for the
#  on-demand Google Maps scraper; scraping only runs when a user presses
#  Scrape - the service is request-driven, no background workers.)
#
# Live deployment: https://map-compete.onrender.com (health: /api/health).
# Keep CORS_ORIGINS here in sync with the deployment target in
# frontend/vercel.json - `python verify_deployment.py` checks both.
services:
  - type: web
    name: mapcompete-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.backend
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    # Render injects $PORT automatically; the entrypoint binds 0.0.0.0:$PORT.
    envVars:
      - key: MONGODB_URI
        sync: false        # paste your Atlas mongodb+srv:// URI (secret)
      - key: MONGODB_DATABASE
        value: competitor_intelligence
      - key: CORS_ORIGINS
        # Comma separated allowed origins: the deployed frontend plus the local
        # dev origins (a page served from localhost may call this API directly;
        # serve_local.py proxies /api/* and needs no CORS at all).
        value: https://map-compete.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: GROQ_API_KEY
        sync: false        # secret
      - key: GEMINI_API_KEY
        sync: false        # secret (optional)
      - key: GROK_API_KEY
        sync: false        # secret (legacy alias, optional)
      - key: GUNICORN_WORKERS
        value: "1"         # one process: the browser needs most of the 512 MB
      - key: GUNICORN_THREADS
        value: "4"         # threads keep health checks and reads answered during a scrape
      - key: GUNICORN_TIMEOUT
        value: "1800"      # project-wide scrapes can take minutes
      - key: FLASK_ENV
        value: production
